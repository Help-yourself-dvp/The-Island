// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Keep the decisive Gradle cause visible in GitHub's check annotations even when
// the hosted raw-log endpoint is unavailable to the development agent.
gradle.buildFinished { result ->
    if (result.failure != null && System.getenv('GITHUB_ACTIONS') == 'true') {
        def causes = []
        def current = result.failure
        while (current != null && causes.size() < 8) {
            if (current.message != null) causes.add(current.message.replace('\n', ' ').replace('\r', ' '))
            current = current.cause
        }
        def message = causes.join(' | ').replace('%', '%25').replace('::', ':')
        println "::error title=Android Gradle failure::${message}"
    }
}
