<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#82cbd1" />
    <title>Остров снова жив — Art Audition</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game" aria-label="Трёхмерная сцена острова"></canvas>
      <div id="loading" role="status"><div class="loading-mark">◈</div><strong>ОСТРОВ СНОВА ЖИВ</strong><span>готовим остров…</span><div class="loading-track"><i></i></div></div>
      <header class="brand"><span>ОСТРОВ СНОВА ЖИВ</span><small>ART AUDITION · v0.1.2</small></header>
      <div id="joystick" aria-label="Виртуальный стик"><div class="joystick-ring"><div class="joystick-knob"></div></div></div>
      <button id="camera-button" type="button" aria-label="Сменить отладочный ракурс" hidden>◆</button>
      <aside id="debug" hidden></aside>
      <div class="hint">СТИК / WASD — ПРОГУЛКА</div>
      <div id="error" hidden></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
