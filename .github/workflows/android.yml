name: Android Art Audition

on:
  push:
    branches: [arena/01a023b0-the-island]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Validate version and assets
        run: |
          npm run assets:audit
          node tools/validate-version.mjs
          echo "VERSION=$(cat version.txt)" >> "$GITHUB_ENV"

      - name: Build web and sync Android
        run: |
          npm run build
          npx cap sync android

      - name: Build signed alpha APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify and name APK
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          if "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump permissions "$APK" | grep -q android.permission.INTERNET; then
            echo "Unexpected INTERNET permission in offline APK" >&2
            exit 1
          fi
          keytool -printcert -jarfile "$APK" | grep -E 'SHA256|Owner|Issuer'
          cp "$APK" "island-revival-${VERSION}-art-audition.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: island-revival-${{ env.VERSION }}-art-audition
          path: island-revival-${{ env.VERSION }}-art-audition.apk
          if-no-files-found: error
          retention-days: 30
